name: build
run-name: ${{ github.actor }} is building 🚀
on:
  workflow_dispatch:
    inputs:
      changelog:
        description: '更新说明'
        required: true
        default: '- 功能优化和问题修复'
        type: string
jobs:
  build-ios:
    runs-on: self-hosted
    env:
      ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
      ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
      ASC_API_PRIVATE_KEY_BASE64: ${{ secrets.ASC_API_PRIVATE_KEY_BASE64 }}
      ASC_APPLE_ID: ${{ secrets.ASC_APPLE_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Build iOS ipa
        run: |
          fvm flutter clean
          fvm flutter pub get
          fvm flutter build ipa --export-method app-store
          IPA_PATH=$(find build/ios/ipa -name "*.ipa" -type f | head -n 1)
          echo "Built IPA: $IPA_PATH"
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"
      - name: Validate and upload iOS IPA to TestFlight
        run: |
          set -euo pipefail

          if [ -z "$ASC_API_KEY_ID" ] || [ -z "$ASC_API_ISSUER_ID" ] || [ -z "$ASC_API_PRIVATE_KEY_BASE64" ] || [ -z "$ASC_APPLE_ID" ]; then
            echo "Missing App Store Connect secrets: ASC_API_KEY_ID, ASC_API_ISSUER_ID, ASC_API_PRIVATE_KEY_BASE64, ASC_APPLE_ID"
            exit 1
          fi

          PRIVATE_KEYS_DIR="$RUNNER_TEMP/appstoreconnect/private_keys"
          mkdir -p "$PRIVATE_KEYS_DIR"
          echo "$ASC_API_PRIVATE_KEY_BASE64" | base64 -D > "$PRIVATE_KEYS_DIR/AuthKey_$ASC_API_KEY_ID.p8"

          export API_PRIVATE_KEYS_DIR="$PRIVATE_KEYS_DIR"

          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apple-id "$ASC_APPLE_ID" \
            --api-key "$ASC_API_KEY_ID" \
            --api-issuer "$ASC_API_ISSUER_ID"
  build-android:
    runs-on: self-hosted
    env:
      PGYER_API_KEY: ${{ secrets.PGYER_API_KEY }}
    outputs:
      pgyer_url: ${{ steps.wait-pgyer.outputs.pgyer_url }}
      pgyer_qrcode_url: ${{ steps.wait-pgyer.outputs.pgyer_qrcode_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build Android apk
        run: |
          fvm flutter clean
          fvm flutter pub get
          fvm flutter build apk
          PACKAGE_PATH=build/app/outputs/flutter-apk/app-release.apk
          echo "PACKAGE_PATH=$PACKAGE_PATH"
          echo "PACKAGE_PATH=$PACKAGE_PATH" >> "$GITHUB_ENV"
  notify-feishu:
    name: Notify Feishu
    runs-on: self-hosted
    needs:
      - build-ios
      - build-android
    if: always()
    env:
      FEISHU_BOT_WEBHOOK: ${{ secrets.FEISHU_BOT_WEBHOOK }}
      FEISHU_BOT_SECRET: ${{ secrets.FEISHU_BOT_SECRET }}
      IOS_RESULT: ${{ needs.build-ios.result }}
      ANDROID_RESULT: ${{ needs.build-android.result }}
      PGYER_URL: ${{ needs.build-android.outputs.pgyer_url }}
      PGYER_QRCODE_URL: ${{ needs.build-android.outputs.pgyer_qrcode_url }}
      CHANGELOG: ${{ github.event.inputs.changelog }}
      WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      REPOSITORY: ${{ github.repository }}
      REF_NAME: ${{ github.ref_name }}
      ACTOR: ${{ github.actor }}
    steps:
      - name: Send build result to Feishu
        if: env.FEISHU_BOT_WEBHOOK != ''
        run: |
          if [ "$IOS_RESULT" = "success" ] && [ "$ANDROID_RESULT" = "success" ]; then
            STATUS="成功"
            STATUS_COLOR="green"
          else
            STATUS="失败"
            STATUS_COLOR="red"
          fi
          export STATUS STATUS_COLOR

          python3 - <<'PY'
          import json
          import os
          import time
          import hmac
          import base64
          import hashlib

          status = os.environ["STATUS"]
          status_color = os.environ["STATUS_COLOR"]
          timestamp = str(int(time.time()))
          secret = os.environ["FEISHU_BOT_SECRET"]
          sign_string = f"{timestamp}\n{secret}".encode("utf-8")
          sign = base64.b64encode(
              hmac.new(sign_string, b"", digestmod=hashlib.sha256).digest()
          ).decode("utf-8")
          content = (
              f"**仓库**：{os.environ['REPOSITORY']}\n"
              f"**分支**：{os.environ['REF_NAME']}\n"
              f"**触发人**：{os.environ['ACTOR']}\n"
              f"**iOS**：{os.environ['IOS_RESULT']}\n"
              f"**Android**：{os.environ['ANDROID_RESULT']}\n"
              f"**蒲公英**：{os.environ['PGYER_URL'] or '未上传'}\n"
              f"**更新说明**：\n{os.environ['CHANGELOG']}"
          )
          payload = {
              "timestamp": timestamp,
              "sign": sign,
              "msg_type": "interactive",
              "card": {
                  "config": {"wide_screen_mode": True},
                  "header": {
                      "template": status_color,
                      "title": {
                          "tag": "plain_text",
                          "content": f"构建{status}",
                      },
                  },
                  "elements": [
                      {
                          "tag": "div",
                          "text": {
                              "tag": "lark_md",
                              "content": content,
                          },
                      },
                      {
                          "tag": "action",
                          "actions": [
                              {
                                  "tag": "button",
                                  "text": {
                                      "tag": "plain_text",
                                      "content": "查看构建",
                                  },
                                  "type": "primary",
                                  "url": os.environ["WORKFLOW_URL"],
                              }
                          ],
                      },
                  ],
              },
          }

          with open("feishu-payload.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False)
          PY

          curl -X POST "$FEISHU_BOT_WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d @feishu-payload.json
