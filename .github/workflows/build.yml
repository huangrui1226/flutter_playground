name: build
run-name: ${{ github.actor }} is building 🚀
on:
  workflow_dispatch:
    inputs:
      changelog:
        description: '更新说明'
        required: true
        default: '- 功能优化和问题修复'
        type: string
      pgyer_file_path:
        description: '上传到蒲公英的安装包路径'
        required: true
        default: 'build/app/outputs/flutter-apk/app-debug.apk'
        type: string
jobs:
  build-ios:
    runs-on: self-hosted
    env:
      ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
      ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
      ASC_API_PRIVATE_KEY_BASE64: ${{ secrets.ASC_API_PRIVATE_KEY_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: |
          echo build ios develop runner
      - name: Build iOS IPA for TestFlight
        run: |
          rm -rf build/ios/archive build/ios/ipa

          fvm flutter pub get
          fvm flutter build ipa --release --export-method app-store

          mapfile -t IPA_FILES < <(find build/ios/ipa -name "*.ipa" -type f)
          if [ "${#IPA_FILES[@]}" -eq 0 ]; then
            echo "IPA file not found under build/ios/ipa"
            exit 1
          fi
          if [ "${#IPA_FILES[@]}" -gt 1 ]; then
            echo "Expected exactly one IPA file, found ${#IPA_FILES[@]}:"
            printf '%s\n' "${IPA_FILES[@]}"
            exit 1
          fi

          IPA_PATH="${IPA_FILES[0]}"
          echo "Built IPA: $IPA_PATH"

          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"

      - name: Print iOS IPA and TestFlight build numbers
        run: |
          set -euo pipefail

          if [ -z "$ASC_API_KEY_ID" ] || [ -z "$ASC_API_ISSUER_ID" ] || [ -z "$ASC_API_PRIVATE_KEY_BASE64" ]; then
            echo "Missing App Store Connect secrets: ASC_API_KEY_ID, ASC_API_ISSUER_ID, ASC_API_PRIVATE_KEY_BASE64"
            exit 1
          fi

          PRIVATE_KEYS_DIR="$RUNNER_TEMP/appstoreconnect/private_keys"
          mkdir -p "$PRIVATE_KEYS_DIR"

          python3 - <<'PY'
          import base64
          import os

          key_id = os.environ["ASC_API_KEY_ID"]
          key_base64 = os.environ["ASC_API_PRIVATE_KEY_BASE64"]
          private_keys_dir = os.path.join(os.environ["RUNNER_TEMP"], "appstoreconnect", "private_keys")
          os.makedirs(private_keys_dir, exist_ok=True)

          key_path = os.path.join(private_keys_dir, f"AuthKey_{key_id}.p8")
          with open(key_path, "wb") as f:
              f.write(base64.b64decode(key_base64))
          PY

          export API_PRIVATE_KEYS_DIR="$PRIVATE_KEYS_DIR"

          IPA_INFO_DIR="$RUNNER_TEMP/ipa-info"
          rm -rf "$IPA_INFO_DIR"
          mkdir -p "$IPA_INFO_DIR"
          unzip -q "$IPA_PATH" "Payload/*.app/Info.plist" -d "$IPA_INFO_DIR"
          APP_INFO_PLIST=$(find "$IPA_INFO_DIR/Payload" -name Info.plist -type f | head -n 1)
          if [ -z "$APP_INFO_PLIST" ]; then
            echo "Info.plist not found in IPA: $IPA_PATH"
            exit 1
          fi

          IPA_BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_INFO_PLIST")
          IPA_MARKETING_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP_INFO_PLIST")
          IPA_BUILD_NUMBER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP_INFO_PLIST")
          echo "Checking App Store Connect build number: bundle_id=$IPA_BUNDLE_ID version=$IPA_MARKETING_VERSION build_number=$IPA_BUILD_NUMBER"

          ASC_JWT=$(ruby -ropenssl -rjson -rbase64 -rdigest -e '
            def b64url(value)
              Base64.urlsafe_encode64(value).delete("=")
            end

            key_id = ENV.fetch("ASC_API_KEY_ID")
            issuer_id = ENV.fetch("ASC_API_ISSUER_ID")
            key_path = File.join(ENV.fetch("API_PRIVATE_KEYS_DIR"), "AuthKey_#{key_id}.p8")
            private_key = OpenSSL::PKey::EC.new(File.read(key_path))
            header = b64url({ alg: "ES256", kid: key_id, typ: "JWT" }.to_json)
            payload = b64url({
              iss: issuer_id,
              exp: Time.now.to_i + 20 * 60,
              aud: "appstoreconnect-v1"
            }.to_json)
            signing_input = "#{header}.#{payload}"
            digest = Digest::SHA256.digest(signing_input)
            der_signature = private_key.dsa_sign_asn1(digest)
            sequence = OpenSSL::ASN1.decode(der_signature)
            raw_signature = sequence.value.map { |int| int.value.to_s(2).rjust(32, "\0") }.join
            puts "#{signing_input}.#{b64url(raw_signature)}"
          ')

          curl -sS -G "https://api.appstoreconnect.apple.com/v1/apps" \
            -H "Authorization: Bearer $ASC_JWT" \
            --data-urlencode "filter[bundleId]=$IPA_BUNDLE_ID" \
            --data-urlencode "limit=1" \
            -o asc-apps.json

          ASC_APP_ID=$(python3 - <<'PY'
          import json

          with open("asc-apps.json", encoding="utf-8") as f:
              response = json.load(f)

          data = response.get("data", [])
          if not data:
              raise SystemExit(f"App Store Connect app not found: {response}")

          print(data[0]["id"])
          PY
          )

          export ASC_JWT ASC_APP_ID IPA_MARKETING_VERSION IPA_BUILD_NUMBER
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.parse
          import urllib.request

          def request_json(url, headers):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as resp:
                  response = json.loads(resp.read().decode("utf-8"))

              if "errors" in response:
                  raise SystemExit(f"App Store Connect API request failed: {response}")

              return response

          def parse_build_number(value):
              value = str(value)
              if not value.isdigit():
                  raise SystemExit(f"Unsupported App Store Connect build number format, expected integer: {value}")
              return int(value)

          def get_ios_pre_release_version_id(headers):
              params = urllib.parse.urlencode({
                  "filter[app]": os.environ["ASC_APP_ID"],
                  "filter[platform]": "IOS",
                  "filter[version]": os.environ["IPA_MARKETING_VERSION"],
                  "limit": "1",
              })
              url = f"https://api.appstoreconnect.apple.com/v1/preReleaseVersions?{params}"
              response = request_json(url, headers)
              versions = response.get("data", [])
              return versions[0]["id"] if versions else None

          def get_uploaded_build_numbers(pre_release_version_id, headers):
              uploaded_build_numbers = []
              params = urllib.parse.urlencode({"limit": "200"})
              url = f"https://api.appstoreconnect.apple.com/v1/preReleaseVersions/{pre_release_version_id}/builds?{params}"

              while url:
                  response = request_json(url, headers)

                  for build in response.get("data", []):
                      build_number = build.get("attributes", {}).get("version")
                      if build_number is not None:
                          uploaded_build_numbers.append(build_number)

                  url = response.get("links", {}).get("next")

              return uploaded_build_numbers

          def show_current_and_uploaded_versions():
              current_build_number = parse_build_number(os.environ["IPA_BUILD_NUMBER"])
              headers = {"Authorization": f"Bearer {os.environ['ASC_JWT']}"}

              print(
                  "Current IPA version: "
                  f"{os.environ['IPA_MARKETING_VERSION']} "
                  f"build {os.environ['IPA_BUILD_NUMBER']}",
                  file=sys.stderr,
              )

              pre_release_version_id = get_ios_pre_release_version_id(headers)
              if pre_release_version_id is None:
                  print(
                      "Uploaded TestFlight builds: none "
                      f"for iOS version {os.environ['IPA_MARKETING_VERSION']}",
                      file=sys.stderr,
                  )
                  return None

              print(
                  f"Found App Store Connect iOS pre-release version id: {pre_release_version_id}",
                  file=sys.stderr,
              )

              uploaded_build_numbers = get_uploaded_build_numbers(pre_release_version_id, headers)
              if not uploaded_build_numbers:
                  print("Uploaded TestFlight builds: none", file=sys.stderr)
                  return None

              print(
                  "Uploaded TestFlight build numbers: "
                  + ", ".join(uploaded_build_numbers),
                  file=sys.stderr,
              )

              for uploaded_build_number in uploaded_build_numbers:
                  if parse_build_number(uploaded_build_number) >= current_build_number:
                      return uploaded_build_number

              return None

          show_current_and_uploaded_versions()
          PY
  build-android:
    runs-on: self-hosted
    env:
      PGYER_API_KEY: ${{ secrets.PGYER_API_KEY }}
    outputs:
      pgyer_url: ${{ steps.wait-pgyer.outputs.pgyer_url }}
      pgyer_qrcode_url: ${{ steps.wait-pgyer.outputs.pgyer_qrcode_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: |
          echo build android develop runner
      - name: Get Pgyer upload token
        id: get-pgyer-token
        if: env.PGYER_API_KEY != ''
        env:
          PACKAGE_PATH: ${{ github.event.inputs.pgyer_file_path }}
          CHANGELOG: ${{ github.event.inputs.changelog }}
        run: |
          if [ ! -f "$PACKAGE_PATH" ]; then
            echo "Package file not found: $PACKAGE_PATH"
            exit 1
          fi

          case "$PACKAGE_PATH" in
            *.apk) BUILD_TYPE="apk" ;;
            *.ipa) BUILD_TYPE="ipa" ;;
            *)
              echo "Pgyer only supports apk or ipa files: $PACKAGE_PATH"
              exit 1
              ;;
          esac

          curl -sS -X POST "https://www.pgyer.com/apiv2/app/getCOSToken" \
            --data-urlencode "_api_key=$PGYER_API_KEY" \
            --data-urlencode "buildType=$BUILD_TYPE" \
            --data-urlencode "buildInstallType=1" \
            --data-urlencode "buildUpdateDescription=$CHANGELOG" \
            -o pgyer-token.json

          python3 - <<'PY'
          import json
          import os

          with open("pgyer-token.json", encoding="utf-8") as f:
              response = json.load(f)

          if response.get("code") != 0:
              raise SystemExit(f"Failed to get Pgyer upload token: {response}")

          data = response["data"]
          params = data["params"]
          outputs = {
              "endpoint": data["endpoint"],
              "build_key": data["key"],
              "key": params["key"],
              "signature": params["signature"],
              "security_token": params["x-cos-security-token"],
          }

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              for name, value in outputs.items():
                  f.write(f"{name}={value}\n")
          PY

      - name: Upload package to Pgyer
        if: steps.get-pgyer-token.outputs.endpoint != ''
        env:
          PACKAGE_PATH: ${{ github.event.inputs.pgyer_file_path }}
          PGYER_ENDPOINT: ${{ steps.get-pgyer-token.outputs.endpoint }}
          PGYER_KEY: ${{ steps.get-pgyer-token.outputs.key }}
          PGYER_SIGNATURE: ${{ steps.get-pgyer-token.outputs.signature }}
          PGYER_SECURITY_TOKEN: ${{ steps.get-pgyer-token.outputs.security_token }}
        run: |
          HTTP_CODE=$(curl -sS -o pgyer-upload-response.txt -w "%{http_code}" \
            -X POST "$PGYER_ENDPOINT" \
            -F "key=$PGYER_KEY" \
            -F "signature=$PGYER_SIGNATURE" \
            -F "x-cos-security-token=$PGYER_SECURITY_TOKEN" \
            -F "x-cos-meta-file-name=$(basename "$PACKAGE_PATH")" \
            -F "file=@$PACKAGE_PATH")

          if [ "$HTTP_CODE" != "204" ]; then
            echo "Failed to upload package to Pgyer, HTTP status: $HTTP_CODE"
            cat pgyer-upload-response.txt
            exit 1
          fi

      - name: Wait for Pgyer publish result
        id: wait-pgyer
        if: steps.get-pgyer-token.outputs.build_key != ''
        env:
          PGYER_API_KEY: ${{ secrets.PGYER_API_KEY }}
          PGYER_BUILD_KEY: ${{ steps.get-pgyer-token.outputs.build_key }}
        run: |
          for i in $(seq 1 30); do
            curl -sS -G "https://www.pgyer.com/apiv2/app/buildInfo" \
              --data-urlencode "_api_key=$PGYER_API_KEY" \
              --data-urlencode "buildKey=$PGYER_BUILD_KEY" \
              -o pgyer-build-info.json

            CODE=$(python3 -c 'import json; print(json.load(open("pgyer-build-info.json")).get("code"))')
            if [ "$CODE" = "0" ]; then
              python3 - <<'PY'
              import json
              import os

              with open("pgyer-build-info.json", encoding="utf-8") as f:
                  response = json.load(f)

              data = response["data"]
              shortcut = data.get("buildShortcutUrl", "")
              install_url = f"https://www.pgyer.com/{shortcut}" if shortcut else ""
              qrcode_url = data.get("buildQRCodeURL", "")

              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
                  f.write(f"pgyer_url={install_url}\n")
                  f.write(f"pgyer_qrcode_url={qrcode_url}\n")
              PY
              exit 0
            fi

            if [ "$CODE" != "1247" ]; then
              echo "Pgyer publish failed:"
              cat pgyer-build-info.json
              exit 1
            fi

            sleep 5
          done

          echo "Timed out waiting for Pgyer publish result"
          exit 1
  notify-feishu:
    name: Notify Feishu
    runs-on: self-hosted
    needs:
      - build-ios
      - build-android
    if: always()
    env:
      FEISHU_BOT_WEBHOOK: ${{ secrets.FEISHU_BOT_WEBHOOK }}
      FEISHU_BOT_SECRET: ${{ secrets.FEISHU_BOT_SECRET }}
      IOS_RESULT: ${{ needs.build-ios.result }}
      ANDROID_RESULT: ${{ needs.build-android.result }}
      PGYER_URL: ${{ needs.build-android.outputs.pgyer_url }}
      PGYER_QRCODE_URL: ${{ needs.build-android.outputs.pgyer_qrcode_url }}
      CHANGELOG: ${{ github.event.inputs.changelog }}
      WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      REPOSITORY: ${{ github.repository }}
      REF_NAME: ${{ github.ref_name }}
      ACTOR: ${{ github.actor }}
    steps:
      - name: Send build result to Feishu
        if: env.FEISHU_BOT_WEBHOOK != ''
        run: |
          if [ "$IOS_RESULT" = "success" ] && [ "$ANDROID_RESULT" = "success" ]; then
            STATUS="成功"
            STATUS_COLOR="green"
          else
            STATUS="失败"
            STATUS_COLOR="red"
          fi
          export STATUS STATUS_COLOR

          python3 - <<'PY'
          import json
          import os
          import time
          import hmac
          import base64
          import hashlib

          status = os.environ["STATUS"]
          status_color = os.environ["STATUS_COLOR"]
          timestamp = str(int(time.time()))
          secret = os.environ["FEISHU_BOT_SECRET"]
          sign_string = f"{timestamp}\n{secret}".encode("utf-8")
          sign = base64.b64encode(
              hmac.new(sign_string, b"", digestmod=hashlib.sha256).digest()
          ).decode("utf-8")
          content = (
              f"**仓库**：{os.environ['REPOSITORY']}\n"
              f"**分支**：{os.environ['REF_NAME']}\n"
              f"**触发人**：{os.environ['ACTOR']}\n"
              f"**iOS**：{os.environ['IOS_RESULT']}\n"
              f"**Android**：{os.environ['ANDROID_RESULT']}\n"
              f"**蒲公英**：{os.environ['PGYER_URL'] or '未上传'}\n"
              f"**更新说明**：\n{os.environ['CHANGELOG']}"
          )
          payload = {
              "timestamp": timestamp,
              "sign": sign,
              "msg_type": "interactive",
              "card": {
                  "config": {"wide_screen_mode": True},
                  "header": {
                      "template": status_color,
                      "title": {
                          "tag": "plain_text",
                          "content": f"构建{status}",
                      },
                  },
                  "elements": [
                      {
                          "tag": "div",
                          "text": {
                              "tag": "lark_md",
                              "content": content,
                          },
                      },
                      {
                          "tag": "action",
                          "actions": [
                              {
                                  "tag": "button",
                                  "text": {
                                      "tag": "plain_text",
                                      "content": "查看构建",
                                  },
                                  "type": "primary",
                                  "url": os.environ["WORKFLOW_URL"],
                              }
                          ],
                      },
                  ],
              },
          }

          with open("feishu-payload.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False)
          PY

          curl -X POST "$FEISHU_BOT_WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d @feishu-payload.json
